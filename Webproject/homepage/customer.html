<html>

    <h1>Foodie</h1>
    <p>Online food Platform</p>
        <center>
        <form>
        <fieldset style="width: 400px;">
            <legend>
                Customer Registration
            </legend>
            Name:
            <input type="text">
            <br><br>
            Email:
            <input type="email">
            <br><br>
            Password:
            <input type="password">
            <br><br>
            Confirm Password:
            <input type="password">
            <br><br>
            Phone:
            <input type="number">
            <br><br>
            Date of Birth:
            <input type="date">
            <br><br>
            Gender:
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            Address:
            <textarea rows="3" cols="25"></textarea>
            <br><br>
            City:
            <select>
                <option>Dhaka</option>
                <option>Chittagong</option>
                <option>Sylhet</option>
                <option>Rajshahi</option>
                <option>Khulna</option>
            </select>
            <br><br>
            Favorite Food:
            <select>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Chicken</option>
                <option>Pasta</option>
                <option>Drinks</option>
            </select>
            <br><br>
            Food Preference:
            <input type="checkbox">Vegetarian
            <input type="checkbox">Non-Vegetarian
            <br><br>
            <input type="checkbox">
            I agree to the terms and conditions.
            <br><br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear Form">
        </fieldset>
        </form>
        </center>
    </body>
</html>
