<!DOCTYPE html>
<html>
<head>
    <title>Foodie Website</title>
    
</head>
<body>
    
    <div align="right">
        <a href="home.html">Home</a> |
        <a href="#">Offer</a>  |
        <a href="#">About</a>  |
        <a href="register.html">Register</a>  |
        <a href="#">Login</a>
    </div>
  
    <h1>Foodie</h1>
    <p>Online food Platform</p>
       
    <center>
        <form>
           
            <fieldset>
                <h2 align="center">Welcome To Supervisor Registration Form</h2>
                
                
                <table cellpadding="8">
                    <tr>
                        <td>Full Name</td>
                        <td>:</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>:</td>
                        <td><input type="email" placeholder="input your email"></td>
                    </tr>
                    <tr>
                        <td>Phone Number</td>
                        <td>:</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td>:</td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td>Confirm Password</td>
                        <td>:</td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td>Date of Birth</td>
                        <td>:</td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td>Gender</td>
                        <td>:</td>
                        <td>
                            <input type="radio" name="gender"> Male
                            <input type="radio" name="gender"> Female
                        </td>
                    </tr>
                    <tr>
                        <td>Nid Number</td>
                        <td>:</td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Vehicle Type</td>
                        <td>:</td>
                        <td>
                            <select>
                                <option>Bike</option>
                                <option>Bicycle</option>
                                <option>Car</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Upload your Nid</td>
                        <td>:</td>
                        <td><input type="file"></td>
                    </tr>
                    <tr>
                        <td>Upload your Photo</td>
                        <td>:</td>
                        <td><input type="file"></td>
                    </tr>
                    <tr>
                        <td colspan="3" align="center">
                            <br>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </center>

    <hr>
</body>
</html>
